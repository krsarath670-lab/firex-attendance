databases:
  - name: firex-db
    databaseName: firex_attendance
    user: firex_user
    plan: free
    region: frankfurt

services:
  - type: web
    name: firex-attendance
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install --include=dev && npm run build
    startCommand: node server/index.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: TIMEZONE
        value: Asia/Bahrain
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: firex-db
          property: connectionString
